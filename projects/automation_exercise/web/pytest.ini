[pytest]
# ============================================================
# pytest configuration for Automation Exercise web testing
# ============================================================

# Default test discovery paths
testpaths = tests

# Add THIS project's root directory to sys.path so that pages/, utils/,
# fixtures/ are importable when running pytest from any working directory
# (repo root, projects/, or automation_exercise/ itself).
# The dot means "the directory containing this pytest.ini file".
pythonpath = .

# Markers registration (avoids PytestUnknownMarkWarning)
markers =
    smoke: Quick sanity checks for critical paths
    regression: Full regression test suite
    auth: Authentication related tests
    products: Product browsing and search tests
    cart: Shopping cart tests
    checkout: Checkout flow tests
    contact: Contact form tests
    slow: Tests that take longer to complete

# Default command-line options
addopts =
    # currently there's issue that command line --browser doesn't override --browser in pytest.ini,
    # but combines the two settings so test cases will be executed in pytest.ini defined browser first, then in command line --browser
    # so if you need to specify it from command line(to be driven in CI pipeline), then don't set default value in pytest.ini
    # --browser=firefox
    -v
    --tb=short
    --strict-markers
    --reportdir=projects/automation_exercise/web/testreport
    --alluredir=projects/automation_exercise/web/testreport/allure-results

# Per-test timeout in seconds — requires pytest-timeout to be installed.
# Install with: pip install pytest-timeout
# If you do not want this feature, comment out the line below.
timeout = 60

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
